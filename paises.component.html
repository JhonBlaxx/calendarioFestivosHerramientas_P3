<h2>Países</h2>

@if (mensaje()) {
  <div class="alerta ok">{{ mensaje() }}</div>
}
@if (error()) {
  <div class="alerta error">{{ error() }}</div>
}

<section class="tarjeta">
  <h3>{{ form().id === 0 ? 'Nuevo país' : 'Editar país' }}</h3>
  <form #f="ngForm" (ngSubmit)="guardar()" class="formulario">
    <label>
      Nombre
      <input
        name="nombre"
        required
        maxlength="100"
        [ngModel]="form().nombre"
        (ngModelChange)="cambiarNombre($event)"
      />
    </label>
    <div class="acciones">
      <button type="submit" class="btn primario" [disabled]="f.invalid">Guardar</button>
      @if (form().id !== 0) {
        <button type="button" class="btn" (click)="cancelar()">Cancelar</button>
      }
    </div>
  </form>
</section>

<section class="tarjeta">
  <table>
    <thead>
      <tr>
        <th>Id</th>
        <th>Nombre</th>
        <th class="col-acciones">Acciones</th>
      </tr>
    </thead>
    <tbody>
      @for (p of paises(); track p.id) {
        <tr>
          <td>{{ p.id }}</td>
          <td>{{ p.nombre }}</td>
          <td class="col-acciones">
            <button type="button" class="btn" (click)="editar(p)">Editar</button>
            <button type="button" class="btn peligro" (click)="eliminar(p)">Eliminar</button>
          </td>
        </tr>
      } @empty {
        <tr>
          <td colspan="3" class="vacio">No hay países registrados.</td>
        </tr>
      }
    </tbody>
  </table>
</section>
